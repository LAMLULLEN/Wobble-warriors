<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wobble Warriors 3D — prototype</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font:16px system-ui,Arial;overflow:hidden}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:12px;right:12px;top:12px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.panel{background:#101827dd;border:1px solid #ffffff30;border-radius:14px;padding:10px 12px;box-shadow:0 8px 24px #0003}
h1{font-size:clamp(17px,3vw,26px);margin:0 0 3px;color:#ffd166}.small{font-size:12px;color:#cbd5e1}
#status{max-width:52%;font-size:14px}
#controls{position:fixed;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;gap:12px;align-items:end}
.group{display:flex;gap:7px;flex-wrap:wrap;max-width:70%}
button{border:1px solid #ffffff3b;border-radius:12px;padding:12px 14px;background:#24334b;color:white;font-weight:700;font-size:14px;touch-action:manipulation;cursor:pointer}
button:active{transform:scale(.97);background:#355079}button.action{background:#bd3545}button.good{background:#237a61}
#hint{font-size:12px;line-height:1.4;max-width:260px}
@media(max-width:600px){#controls{flex-direction:column;align-items:stretch}.group{max-width:100%;justify-content:center}.group button{flex:1;padding:13px 8px}#status{max-width:60%}#hint{display:none}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div class="panel"><h1>WOBBLE WARRIORS</h1><div class="small">3D browserprototype · Update 0.3</div></div>
  <div class="panel" id="status">Laden…</div>
</div>
<div id="controls">
  <div class="panel" id="hint">Doel: duw de rode vechter van het platform. De AI probeert jou te benaderen en aan te vallen.<br>Toetsenbord: WASD/pijltjes, spatie = slaan, E = grijpen/loslaten, Q = gooien.</div>
  <div class="group">
    <button data-move="forward">▲ Vooruit</button>
    <button data-move="left">◀ Links</button>
    <button data-move="back">▼ Achteruit</button>
    <button data-move="right">Rechts ▶</button>
  </div>
  <div class="group">
    <button class="action" id="punch">👊 Slaan</button>
    <button class="good" id="grab">✊ Grijpen</button>
    <button class="action" id="throw">💥 Gooien</button>
    <button id="reset">↻ Opnieuw</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
const root=document.getElementById('game'), status=document.getElementById('status');
if(!window.THREE){status.textContent='Three.js kon niet laden. Open deze demo met internetverbinding.';return;}
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x9bd8f4); scene.fog=new THREE.Fog(0x9bd8f4,22,48);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100); camera.position.set(8,8,12);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe7f7ff,0x61764d,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2); sun.position.set(-5,12,7); sun.castShadow=true; scene.add(sun);
const mat=(color,roughness=.72)=>new THREE.MeshStandardMaterial({color,roughness});
const grass=mat(0x659b60), metal=mat(0x48566b), yellow=mat(0xf7bd4b), blue=mat(0x2678ff), red=mat(0xf04452), white=mat(0xffffff), dark=mat(0x17253a);
const floor=new THREE.Mesh(new THREE.BoxGeometry(12,.5,12),grass); floor.position.y=-.25; floor.receiveShadow=true; scene.add(floor);
const grid=new THREE.GridHelper(12,12,0x335d42,0x8fc27e); grid.position.y=.012; scene.add(grid);
for(let i=0;i<4;i++){const rail=new THREE.Mesh(new THREE.BoxGeometry(i%2?12:.22,.42,i%2?.22:12),yellow);rail.position.set(0,.18,0);scene.add(rail);}
for(let i=0;i<8;i++){const post=new THREE.Mesh(new THREE.BoxGeometry(.18,1.1,.18),metal);post.position.set(i<4?-5.7+i*3.8:((i-4)<2?-5.7:5.7),.55,i<4?-5.7:((i-4)%2?5.7:-5.7));scene.add(post);}
function fighter(color,x,z){
 const g=new THREE.Group(); scene.add(g);g.position.set(x,0,z);g.userData={vx:0,vz:0,vy:0,health:100,stun:0,attack:0,held:false,dead:false};
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.62,5,10),mat(color));body.position.y=1.12;body.castShadow=true;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.36,16,12),mat(color));head.position.y=1.9;head.castShadow=true;g.add(head);
 const eyeMat=mat(0xffffff), pupil=mat(0x142039);
 for(const ex of [-.13,.13]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.075,8,8),eyeMat);eye.position.set(ex,1.97,.31);g.add(eye);const p=new THREE.Mesh(new THREE.SphereGeometry(.035,8,8),pupil);p.position.set(ex,1.96,.375);g.add(p);}
 const arms=[];for(const side of [-1,1]){const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.48,4,8),mat(color));arm.position.set(side*.48,1.22,.02);arm.rotation.z=side*-.35;arm.castShadow=true;g.add(arm);arms.push(arm);
 const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.14,.42,4,8),mat(color));leg.position.set(side*.22,.38,0);leg.castShadow=true;g.add(leg);}
 g.userData.body=body;g.userData.head=head;g.userData.arms=arms;return g;
}
let player,enemy,held=false,score=0,round=1,keys={},message='WASD of de knoppen: probeer de rode vechter van het platform te duwen.';
const arenaBounds=5.55;
function reset(){if(player)scene.remove(player);if(enemy)scene.remove(enemy);player=fighter(0x2678ff,-2,1);enemy=fighter(0xf04452,2,-1);held=false;score=0;message='De rode AI zoekt je op. Sla, grijp en gooi!';}
reset();
function distance(a,b){return Math.hypot(a.position.x-b.position.x,a.position.z-b.position.z)}
function punch(){if(player.userData.dead)return;player.userData.attack=.32;if(distance(player,enemy)<1.65&&!enemy.userData.dead){enemy.userData.vx+=(enemy.position.x-player.position.x)*2.4;enemy.userData.vz+=(enemy.position.z-player.position.z)*2.4;enemy.userData.vy=2.2;enemy.userData.health-=22;enemy.userData.stun=.35;message='Raak! De rode vechter wankelt.';}else message='Mis! Kom dichterbij om te raken.';}
function grab(){if(held){held=false;enemy.userData.held=false;message='Je laat de tegenstander los.';return;}if(distance(player,enemy)<1.65&&!enemy.userData.dead){held=true;enemy.userData.held=true;message='Je hebt hem vast! Druk op Gooien.';}else message='Te ver weg om vast te pakken.';}
function throwEnemy(){if(!held){message='Grijp de tegenstander eerst.';return;}held=false;enemy.userData.held=false;const dx=enemy.position.x-player.position.x,dz=enemy.position.z-player.position.z,len=Math.hypot(dx,dz)||1;enemy.userData.vx=dx/len*8;enemy.userData.vz=dz/len*8;enemy.userData.vy=4.2;enemy.userData.health-=30;message='WORP! Kijk uit dat hij niet terugkomt!';}
document.getElementById('punch').onclick=punch;document.getElementById('grab').onclick=grab;document.getElementById('throw').onclick=throwEnemy;document.getElementById('reset').onclick=reset;
document.querySelectorAll('[data-move]').forEach(b=>{const k=b.dataset.move;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false));});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();punch()}if(e.key.toLowerCase()==='e')grab();if(e.key.toLowerCase()==='q')throwEnemy();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function moveFighter(f,dt){const u=f.userData;f.position.x+=u.vx*dt;f.position.z+=u.vz*dt;u.vx*=Math.pow(.08,dt);u.vz*=Math.pow(.08,dt);u.vy-=12*dt;f.position.y+=u.vy*dt;if(f.position.y<0){f.position.y=0;u.vy=0;}f.rotation.z=THREE.MathUtils.clamp(-u.vx*.06,-.5,.5);f.rotation.x=THREE.MathUtils.clamp(u.vz*.05,-.45,.45);u.body.rotation.z=Math.sin(performance.now()*.012+f.position.x)*.07+(u.stun>0?Math.sin(performance.now()*.06)*.22:0);u.head.rotation.z=-u.body.rotation.z*.4;u.arms.forEach((a,i)=>{a.rotation.x=Math.sin(performance.now()*.009+i*2)*.12+(u.attack>0?-.9:0);});u.stun=Math.max(0,u.stun-dt);u.attack=Math.max(0,u.attack-dt);}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.035);last=now;
 if(!player||!enemy)return;
 if(!player.userData.dead){
 let dx=0,dz=0;if(keys.a||keys.arrowleft||keys.left)dx-=1;if(keys.d||keys.arrowright||keys.right)dx+=1;if(keys.w||keys.arrowup||keys.forward)dz-=1;if(keys.s||keys.arrowdown||keys.back)dz+=1;
 const l=Math.hypot(dx,dz)||1;if(dx||dz){player.userData.vx+=dx/l*13*dt;player.userData.vz+=dz/l*13*dt;}
 }
 if(!enemy.userData.dead&&!held){
 const dx=player.position.x-enemy.position.x,dz=player.position.z-enemy.position.z,d=Math.hypot(dx,dz)||1;
 if(enemy.userData.stun<=0&&d>1.25){enemy.userData.vx+=dx/d*3.4*dt;enemy.userData.vz+=dz/d*3.4*dt;}
 else if(enemy.userData.stun<=0&&d<1.55&&Math.random()<dt*.9){player.userData.vx-=dx/d*3.5;player.userData.vz-=dz/d*3.5;player.userData.vy=1.2;message='De rode vechter slaat terug!';}
 }
 if(held){enemy.position.x=player.position.x+.7;enemy.position.z=player.position.z+.2;enemy.position.y=player.position.y+.1;}
 [player,enemy].forEach(f=>{if(!f.userData.held)moveFighter(f,dt);if(Math.abs(f.position.x)>arenaBounds||Math.abs(f.position.z)>arenaBounds){if(!f.userData.dead){f.userData.dead=true;f.position.y=-2;if(f===enemy){score+=100;message='Gewonnen! De rode vechter ligt uit de arena.';}else message='Je bent uit de arena gevallen! Druk op Opnieuw.';}}});
 if(enemy.userData.health<=0&&!enemy.userData.dead){enemy.userData.dead=true;enemy.position.y=-2;score+=100;message='Knock-out! Jij wint!';}
 const target=new THREE.Vector3(player.position.x+7,7,player.position.z+9);camera.position.lerp(target,dt*1.8);camera.lookAt(player.position.x,0,player.position.z);
 status.innerHTML=`<b>Jij</b> ${Math.max(0,Math.round(player.userData.health))}% &nbsp; <b>Rood</b> ${Math.max(0,Math.round(enemy.userData.health))}%<br><span class="small">${message}</span>`;
 renderer.render(scene,camera);
}
requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
})();
</script>
</body>
</html>
